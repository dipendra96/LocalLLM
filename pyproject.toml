[project]
name = "localchat"
version = "0.1.0"
description = "Local-first modular agent chat powered by Ollama"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "google-adk[db]==2.12.0", "litellm==1.105.1", "httpx>=0.28,<1", "duckduckgo-mcp-server==0.7.0", "pillow>=11,<14", "python-multipart>=0.0.20,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
